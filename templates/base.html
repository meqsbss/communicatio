{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}.communicatio{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
  <script src="{% static 'js/htmx.min.js' %}" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'home' %}">.communicatio</a>
    <button class="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false">Menu</button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      <ul>
        <li><a href="{% url 'home' %}">Home</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    {% if messages %}
    <div class="messages">
      {% for message in messages %}
      <p class="message message-{{ message.level_tag }}" role="status">{{ message }}</p>
      {% endfor %}
    </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script>
    (function () {
      var b = document.querySelector(".nav-toggle");
      var n = document.getElementById("site-nav");
      b.addEventListener("click", function () {
        var open = n.classList.toggle("is-open");
        b.setAttribute("aria-expanded", open ? "true" : "false");
      });
    })();
  </script>
</body>
</html>
