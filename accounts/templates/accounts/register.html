{% extends "base.html" %}
{% block title %}Register - .communicatio{% endblock %}
{% block content %}
<h1>Register</h1>
<form method="post" novalidate>
  {% csrf_token %}
  {% for field in form %}
  <p>
    {{ field.label_tag }}
    {{ field }}
    {% for error in field.errors %}<span class="field-error" role="alert">{{ error }}</span>{% endfor %}
  </p>
  {% endfor %}
  <button type="submit">Register</button>
</form>
{% endblock %}
